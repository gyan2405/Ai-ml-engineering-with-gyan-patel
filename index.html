function stats(){let n=completed.length,p=Math.round(n/2);done.textContent=n;pct.textContent=p+"%";bar.style.width=p+"%"}
function renderFolders(){let icons=["🤖","🐍","📐","📊","🧠","✨","⚙️"];folders.innerHTML=RANGES.map((r,i)=>`<button class="card folder" onclick="openFolder(${i})"><div class="icon">${icons[i]}</div><h3>${esc(r.name)}</h3><p>Day ${r.start}–${r.end} • ${r.end-r.start+1} lessons</p><span class="tag">${completed.filter(x=>x>=r.start&&x<=r.end).length}/${r.end-r.start+1} complete</span></button>`).join("")}
function openFolder(i){currentRange=RANGES[i];home.classList.add("hidden");lessonView.classList.add("hidden");daysView.classList.remove("hidden");folderTitle.textContent=currentRange.name;folderMeta.textContent=`Day ${currentRange.start}–${currentRange.end}`;dayList.innerHTML=DAYS.filter(d=>d.day>=currentRange.start&&d.day<=currentRange.end).map(d=>`<button class="card day ${completed.includes(d.day)?"done":""}" onclick="openDay(${d.day})"><span class="num">${d.day}</span><span><h3>${esc(d.title)}</h3><small>${esc(d.phase)}</small></span><span class="check">${completed.includes(d.day)?"✓":"›"}</span></button>`).join("");scrollTo(0,0)}
function md(s){return s.split("\n").map(x=>x.startsWith("## ")?`<h2>${esc(x.slice(3))}</h2>`:x.startsWith("### ")?`<h3>${esc(x.slice(4))}</h3>`:x.startsWith("- ")?`<li>${esc(x.slice(2))}</li>`:x.startsWith("📌")?`<div class="sticky">${esc(x)}</div>`:x.trim()?`<p>${esc(x).replace(/\*\*(.*?)\*\*/g,"<b>$1</b>")}</p>`:"").join("")}
function openDay(n){let d=DAYS[n-1],is=completed.includes(n);daysView.classList.add("hidden");lessonView.classList.remove("hidden");lesson.innerHTML=`<div class="eyebrow">Day ${d.day} • ${esc(d.phase)}</div><h1>${esc(d.title)}</h1>${md(d.notes)}<h2>🧠 Practice Questions — Exactly 10</h2>${d.questions.map((q,i)=>`<div class="q"><b>Q${i+1}.</b> ${esc(q)}</div>`).join("")}<h2>🔥 Daily Challenge</h2><div class="challenge">${d.challenge}</div><h2>✅ Key Takeaways</h2><ul>${d.takeaways.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><button class="btn primary complete" onclick="toggleDone(${n})">${is?"↩ Mark as Incomplete":"✓ Complete Day "+n}</button>`;scrollTo(0,0)}
function toggleDone(n){completed.includes(n)?completed=completed.filter(x=>x!==n):completed.push(n);completed.sort((a,b)=>a-b);localStorage.setItem("aiml200_done",JSON.stringify(completed));stats();renderFolders();openDay(n);toast(completed.includes(n)?"Day completed! 🔥":"Day reopened.")}
function showHome(){home.classList.remove("hidden");daysView.classList.add("hidden");lessonView.classList.add("hidden");renderFolders();scrollTo(0,0)}
function backToDays(){openFolder(RANGES.indexOf(currentRange))}
function searchTopic(){let q=prompt("Search topic/day:");if(!q)return;let d=DAYS.find(x=>(x.title+" "+x.phase).toLowerCase().includes(q.toLowerCase()));if(!d)return toast("No matching lesson found.");let i=RANGES.findIndex(r=>d.day>=r.start&&d.day<=r.end);openFolder(i);openDay(d.day)}
function toast(x){toastEl=document.getElementById("toast");toastEl.textContent=x;toastEl.classList.remove("hidden");setTimeout(()=>toastEl.classList.add("hidden"),1500)}
stats();renderFolders();if("serviceWorker" in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
